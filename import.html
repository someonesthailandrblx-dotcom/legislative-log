<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import data</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:'Prompt',sans-serif;max-width:560px;margin:30px auto;padding:0 16px}input,button{font-family:inherit;font-size:14px;padding:8px;margin:4px 0;width:100%;box-sizing:border-box}pre{background:#f3f3f3;padding:10px;white-space:pre-wrap}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="api.js"></script></head>
<body><h3>One-time data import</h3>
<p>Log in as head admin, choose <b>parliament-export.json</b>, press Import. Tables that already have rows are skipped, so it is safe to run twice.</p>
<input id="u" placeholder="username"><input id="p" type="password" placeholder="password">
<input id="f" type="file" accept=".json"><button id="go">Import</button><pre id="log"></pre>
<script>
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
document.getElementById('go').onclick=async()=>{
  try{
    const sb=window.__parlSb,api=window.__parlApi;
    const r=await new Promise(res=>window.google.script.run.withSuccessHandler(res).loginUser(u.value.trim(),p.value));
    if(!r||!r.ok){log('Login failed: '+(r&&r.msg));return}
    if(r.membership!=='headadmin'&&r.membership!=='admin'){log('Need admin account');return}
    const d=JSON.parse(await f.files[0].text());
    for(const t of ['parl_law','parl_votes','parl_members','parl_cabinet','parl_questions','parl_petitions','parl_agendas','parl_hansard']){
      const rows=d[t]||[];
      const c=await sb.from(t).select('id',{count:'exact',head:true});
      if(c.error){log(t+': '+c.error.message);continue}
      if(c.count>0){log(t+': already has '+c.count+' rows, skipped');continue}
      for(let i=0;i<rows.length;i+=200){
        const e=(await sb.from(t).insert(rows.slice(i,i+200))).error;
        if(e){log(t+' ERROR: '+e.message);break}
      }
      log(t+': '+rows.length+' rows sent');
    }
    log('Done.');
  }catch(e){log('Error: '+e.message)}
};
</script></body></html>
