<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import data</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Prompt',sans-serif;background:#f8f8f8;margin:0;padding:24px 14px;color:#000}
.card{max-width:520px;margin:0 auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h3{margin:0 0 6px;font-size:20px}p{color:#555;font-size:13px;margin:0 0 14px}label{display:block;font-size:12px;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;font:inherit;font-size:14px}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#000;color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}pre{background:#f3f3f3;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;min-height:44px;margin:16px 0 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="api.js"></script></head>
<body><div class="card"><h3>นำเข้าข้อมูล (ครั้งเดียว)</h3>
<p>Log in as head admin, choose <b>parliament-export.json</b>, then press Import. Tables that already have rows are skipped.</p>
<label>Username</label><input id="u" autocomplete="username">
<label>Password</label><input id="p" type="password" autocomplete="current-password">
<label>1. Export file (parliament-export.json)</label><input id="f" type="file" accept=".json">
<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input id="rep" type="checkbox" style="width:auto"> Replace existing data (deletes rows in the tables below first)</label>
<button id="go">Import</button><pre id="log">Waiting…</pre></div>
<script>
const L=document.getElementById('log');let first=true;const log=t=>{if(first){L.textContent='';first=false}L.textContent+=t+'\n'};
document.getElementById('go').onclick=async()=>{
  const btn=document.getElementById('go');
  if(!f.files[0]){log('Please choose the JSON file first.');return}
  btn.disabled=true;log('Working…');
  try{
    const sb=window.__parlSb,api=window.__parlApi;
    const r=await new Promise(res=>window.google.script.run.withSuccessHandler(res).loginUser(u.value.trim(),p.value));
    if(!r||!r.ok){log('Login failed: '+(r&&r.msg));return}
    if(r.membership!=='headadmin'&&r.membership!=='admin'){log('Need admin account');return}
    const d=JSON.parse(await f.files[0].text());
    for(const t of ['parl_law','parl_votes','parl_members','parl_cabinet','parl_questions','parl_petitions','parl_agendas','parl_hansard']){
      const rows=d[t]||[];
      const c=await sb.from(t).select('id',{count:'exact',head:true});
      if(c.error){log(t+': '+c.error.message);continue}
      if(c.count>0&&!rep.checked){log(t+': already has '+c.count+' rows, skipped');continue}
      if(c.count>0){const de=(await sb.from(t).delete().gt('id',0)).error;if(de){log(t+' delete ERROR: '+de.message);continue}log(t+': removed '+c.count+' old rows')}
      for(let i=0;i<rows.length;i+=200){
        const e=(await sb.from(t).insert(rows.slice(i,i+200))).error;
        if(e){log(t+' ERROR: '+e.message);break}
      }
      log(t+': '+rows.length+' rows sent');
    }
    log('Done.');
  }catch(e){log('Error: '+e.message)}
  btn.disabled=false;
};
</script></body></html>
